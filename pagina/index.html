<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Agendaí — agendamento online para salões e consultórios." />
  <title>Agendaí — no ar na AWS</title>
  <style>
    :root { --navy:#111b2b; --orange:#ff9a1f; --cream:#f5f2ec; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--navy); color:var(--cream); font:18px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(720px,100% - 40px); padding:40px 0; }
    .barra { width:84px; height:8px; background:var(--orange); margin-bottom:40px; }
    .eyebrow { color:var(--orange); letter-spacing:.14em; text-transform:uppercase; font:600 .8rem monospace; }
    h1 { font-size:clamp(2.2rem,7vw,4rem); line-height:1.05; margin:12px 0 20px; }
    p { color:#c4cbd9; max-width:56ch; }
    .selo { display:inline-block; margin-top:28px; padding:8px 18px; border:2px solid var(--orange); border-radius:999px; color:var(--orange); font-weight:600; }
  </style>
</head>
<body>
  <main>
    <div class="barra"></div>
    <div class="eyebrow">Agendaí · AWS Community</div>
    <h1>Do zero ao ar.</h1>
    <p>Esta página está rodando na AWS: arquivo no S3 privado, entregue pelo CloudFront com HTTPS.</p>
    <span class="selo">● No ar</span>
  </main>
</body>
</html>
